version: "3.9"

services:
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orion-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
      - db_data:/app/data
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db_data:
    driver: local
